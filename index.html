<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b0f" />
  <title>My Jobs · Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:#0a0b0f;color:#eceef3;min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:24px;text-align:center;line-height:1.55;
    }
    .card{max-width:420px;width:100%}
    .logo{
      width:72px;height:72px;border-radius:18px;margin:0 auto 20px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      display:grid;place-items:center;
      box-shadow:0 8px 28px -6px rgba(99,102,241,.55);
    }
    .logo svg{width:38px;height:38px}
    h1{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
    p{color:#9498a5;font-size:.92rem;margin-bottom:22px}
    .btn{
      font-family:inherit;font-size:.95rem;font-weight:600;
      padding:13px 26px;border-radius:11px;cursor:pointer;
      border:1px solid #6366f1;background:#6366f1;color:#fff;
      display:inline-flex;align-items:center;gap:8px;
      transition:all .18s ease;width:100%;justify-content:center;
      box-shadow:0 4px 16px -4px rgba(99,102,241,.55);
    }
    .btn:hover{background:#8b5cf6;border-color:#8b5cf6}
    .btn.secondary{
      background:transparent;color:#a5b1ff;border-color:rgba(99,102,241,.32);
      box-shadow:none;margin-top:10px;
    }
    .btn.secondary:hover{background:rgba(99,102,241,.14)}
    .btn svg{width:17px;height:17px}
    .hint{font-size:.78rem;color:#6a6f7e;margin-top:18px;line-height:1.5}
    .hint b{color:#9498a5}
    #installWrap{display:none;margin-top:16px}
    #installWrap.show{display:block}
    .spinner{
      width:15px;height:15px;border:2px solid rgba(255,255,255,.35);
      border-top-color:#fff;border-radius:50%;
      animation:spin .7s linear infinite;display:none;
    }
    .btn.loading .spinner{display:inline-block}
    .btn.loading .label{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M12 4V2"/>
        <path d="M14 3.5a2.5 2.5 0 1 1 0 5"/>
        <path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
    </div>
    <h1>My Jobs · Tracker</h1>
    <p>Track applications, test dates, past papers and syllabus — all in one place.</p>

    <button class="btn" id="openBtn">
      <span class="spinner"></span>
      <span class="label">Open App</span>
    </button>

    <div id="installWrap">
      <button class="btn secondary" id="installBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Install on Home Screen
      </button>
    </div>

    <div class="hint">
      <b>iPhone / iPad:</b> tap <b>Share</b> → <b>Add to Home Screen</b>.<br>
      <b>Android:</b> tap the <b>Install</b> button above, or browser menu → <b>Install app</b>.
    </div>
  </div>

  <script>
    // ⬇️ Your Apps Script Web App URL — replace if you redeploy
    const APP_URL = "https://script.google.com/macros/s/AKfycbzlerIXSfBSNVm8vkJnJ0oe09-kK3ATOWlPV8GHP0vvn_y-fjJ9xPP102WYQunH78Iv/exec";

    // Register service worker (required for Android install prompt)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => {
          console.warn("SW registration failed:", err);
        });
      });
    }

    // Capture the Android install prompt
    let deferredPrompt = null;
    const installWrap = document.getElementById("installWrap");
    const installBtn  = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installWrap.classList.add("show");
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log("Install outcome:", outcome);
      deferredPrompt = null;
      installWrap.classList.remove("show");
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installWrap.classList.remove("show");
    });

    // Open App button → redirect to Apps Script
    const openBtn = document.getElementById("openBtn");
    openBtn.addEventListener("click", () => {
      openBtn.classList.add("loading");
      window.location.href = APP_URL;
    });

    // If launched already as installed PWA (standalone), go straight in
    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;
    if (isStandalone) {
      openBtn.classList.add("loading");
      window.location.replace(APP_URL);
    }
  </script>
</body>
</html>
